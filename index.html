
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhiskerHub Giriş</title>
<link rel="icon" type="image/png" href="whiskerhub.png">
 
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700;800;900&display=swap');

:root {
  --ice: #dcecf3;
  --ice-dark: #b8d3df;
  --pink: #f2d8df;
  --pink-dark: #e9bdca;
  --ink: #303943;
  --muted: #77838e;
  --white: #fbfdfe;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 10% 10%, #e7f3f7 0, transparent 40%),
    radial-gradient(ellipse at 90% 85%, #f7e9ed 0, transparent 35%),
    #eef3f5;
}

header {
  height: 76px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(100,125,140,.15);
  background: rgba(251,253,254,.72);
  backdrop-filter: blur(12px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand img {
  width: 39px;
  height: 39px;
  object-fit: contain;
}

.brand-name {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -.5px;
}

.brand-divider {
  color: #b7c5cc;
  font-size: 20px;
}

.brand-section {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: #758895;
}

.header-right {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: #82919b;
}

main {
  width: min(940px, 92%);
  margin: 0 auto;
  padding: 45px 0 55px;
}

.intro {
  text-align: center;
  margin-bottom: 26px;
}

.overline {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2.5px;
  color: #7d9cac;
  margin-bottom: 9px;
}

h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 43px);
  font-weight: 900;
  letter-spacing: -1.8px;
}

.subtitle {
  margin-top: 8px;
  color: #89969f;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
}

/* SAHNE */

.scene {
  position: relative;
  height: 340px;
  overflow: hidden;
  border-radius: 22px;
  background: linear-gradient(145deg, #dcebf1, #e8edf0 65%, #f3e5e9);
  border: 1px solid rgba(120,150,165,.2);
  box-shadow: 0 15px 40px rgba(63,85,99,.09);
}

.wall-detail {
  position: absolute;
  top: 27px;
  left: 7%;
  width: 105px;
  height: 78px;
  border: 5px solid rgba(255,255,255,.65);
  border-radius: 7px;
  background: linear-gradient(135deg,#c4dfe9,#e5eff2);
}

.wall-detail::before,
.wall-detail::after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,.7);
}

.wall-detail::before {
  width: 3px;
  height: 100%;
  left: 50%;
}

.wall-detail::after {
  height: 3px;
  width: 100%;
  top: 50%;
}

.clock {
  position: absolute;
  top: 30px;
  right: 9%;
  width: 49px;
  height: 49px;
  border-radius: 50%;
  background: #fbfdfe;
  border: 3px solid #c5d7df;
}

.clock::before {
  content: "";
  position: absolute;
  width: 2px;
  height: 14px;
  background: #566773;
  left: 21px;
  top: 8px;
}

.clock::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 2px;
  background: #566773;
  left: 21px;
  top: 21px;
  transform: rotate(25deg);
  transform-origin: left;
}

.floor {
  position: absolute;
  bottom: 0;
  height: 45px;
  width: 100%;
  background: rgba(255,255,255,.32);
  border-top: 1px solid rgba(255,255,255,.65);
}

/* KEDİ */

.cat {
  position: absolute;
  width: 250px;
  height: 280px;
  left: 50%;
  bottom: 35px;
  transform: translateX(-50%);
  animation: float 3.8s ease-in-out infinite;
}

@keyframes float {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-5px); }
}

.cat-body {
  position: absolute;
  width: 154px;
  height: 155px;
  bottom: 0;
  left: 48px;
  background: #343d47;
  border-radius: 78px 78px 25px 25px;
}

.cat-head {
  position: absolute;
  width: 176px;
  height: 148px;
  left: 37px;
  top: 35px;
  background: #303943;
  border-radius: 48% 48% 46% 46%;
  z-index: 3;
  isolation: isolate;
  box-shadow: inset 0 -7px 0 rgba(0,0,0,.06);
}

/* Kulaklar artık kafanın üst köşelerinde */

.ear {
  position: absolute;
  top: -43px;
  width: 59px;
  height: 76px;
  background: #303943;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
  z-index: -1;
}

.ear.left {
  left: 11px;
  transform: rotate(-8deg);
}

.ear.right {
  right: 11px;
  transform: rotate(8deg);
}

.ear::after {
  content: "";
  position: absolute;
  width: 29px;
  height: 43px;
  left: 15px;
  top: 23px;
  background: #dbaebd;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

/* Yüz */

.eyes {
  position: absolute;
  top: 55px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 40px;
}

.eye {
  position: relative;
  width: 29px;
  height: 34px;
  border-radius: 50%;
  background: #f7fafb;
  overflow: hidden;
}

.pupil {
  position: absolute;
  width: 12px;
  height: 18px;
  left: 8.5px;
  top: 8px;
  border-radius: 50%;
  background: #303943;
  transition: transform .12s ease-out;
}

.pupil::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: white;
  top: 3px;
  left: 2px;
}

.muzzle {
  position: absolute;
  top: 98px;
  left: 50%;
  transform: translateX(-50%);
  width: 65px;
  display: flex;
  justify-content: space-between;
}

.cheek {
  width: 29px;
  height: 23px;
  background: #687580;
  border-radius: 50%;
}

.nose {
  position: absolute;
  width: 12px;
  height: 9px;
  background: #e8b7c6;
  border-radius: 50% 50% 55% 55%;
  top: 94px;
  left: 82px;
  z-index: 2;
}

.mouth {
  position: absolute;
  top: 102px;
  left: 50%;
  width: 16px;
  height: 10px;
  border-bottom: 2px solid #1f2931;
  border-radius: 0 0 50% 50%;
  transform: translateX(-50%);
}

.whiskers {
  position: absolute;
  top: 106px;
  width: 37px;
  height: 2px;
  background: #aab5bc;
  opacity: .8;
}

.whiskers.left {
  left: 5px;
  transform: rotate(8deg);
}

.whiskers.right {
  right: 5px;
  transform: rotate(-8deg);
}

/* Patiler ve kuyruk */

.paws {
  position: absolute;
  z-index: 5;
  bottom: 0;
  left: 55px;
  width: 140px;
  display: flex;
  justify-content: space-between;
}

.paw {
  width: 58px;
  height: 29px;
  border-radius: 22px 22px 10px 10px;
  background: #56616c;
}

.tail {
  position: absolute;
  z-index: 1;
  width: 80px;
  height: 105px;
  right: -1px;
  bottom: 20px;
  border: 13px solid #303943;
  border-left: 0;
  border-bottom: 0;
  border-radius: 0 65px 0 0;
  transform: rotate(13deg);
  transform-origin: bottom left;
  animation: tail 2.2s ease-in-out infinite;
}

@keyframes tail {
  0%,100% { transform: rotate(13deg); }
  50% { transform: rotate(25deg); }
}

/* MASA */

.desk {
  position: absolute;
  z-index: 4;
  bottom: 31px;
  left: 0;
  width: 100%;
  height: 51px;
  background: linear-gradient(180deg,#9eb9c6,#8ca9b7);
  border-top: 5px solid #c4dbe4;
  box-shadow: 0 -5px 15px rgba(54,75,87,.08);
}

.desk::after {
  content: "";
  position: absolute;
  top: 51px;
  height: 10px;
  width: 100%;
  background: #829eac;
}

.desk-label {
  position: absolute;
  z-index: 7;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.9);
  white-space: nowrap;
}

/* Masadaki evraklar */

.paper-stack {
  position: absolute;
  z-index: 6;
  bottom: 67px;
  left: 8%;
  width: 91px;
  height: 43px;
  transform: rotate(-5deg);
}

.paper {
  position: absolute;
  width: 85px;
  height: 42px;
  background: #fbfdfe;
  border: 1px solid #d5e0e5;
  border-radius: 3px;
  box-shadow: 0 2px 4px rgba(45,65,75,.1);
}

.paper:nth-child(1) {
  left: 5px;
  top: -5px;
  transform: rotate(8deg);
}

.paper:nth-child(2) {
  left: 2px;
  top: -2px;
  transform: rotate(3deg);
}

.paper:nth-child(3) {
  left: 0;
  top: 0;
  padding: 8px;
}

.paper-lines {
  height: 2px;
  width: 55px;
  background: #d5e1e6;
  margin-bottom: 5px;
}

.paper-lines.short {
  width: 35px;
}

.paper-stamp {
  position: absolute;
  right: 7px;
  bottom: 6px;
  border: 1px solid #e3b7c5;
  color: #c28b9d;
  font-family: 'DM Mono', monospace;
  font-size: 6px;
  padding: 2px 3px;
  transform: rotate(-8deg);
}

.pen-holder {
  position: absolute;
  z-index: 6;
  right: 9%;
  bottom: 67px;
  width: 31px;
  height: 39px;
  background: #d7e5eb;
  border: 2px solid #b4cbd5;
  border-radius: 5px 5px 8px 8px;
}

.pen {
  position: absolute;
  bottom: 29px;
  width: 4px;
  height: 35px;
  border-radius: 3px;
  background: #536a79;
}

.pen.one { left: 7px; transform: rotate(-9deg); }
.pen.two { left: 17px; height: 39px; transform: rotate(8deg); background: #c78fa1; }

.stamp {
  position: absolute;
  z-index: 6;
  right: 21%;
  bottom: 69px;
  width: 29px;
  height: 22px;
  border-radius: 4px;
  background: #e8c5cf;
  border-bottom: 5px solid #c994a6;
  transform: rotate(8deg);
}

.stamp::before {
  content: "";
  position: absolute;
  width: 12px;
  height: 8px;
  background: #c994a6;
  left: 8px;
  top: -7px;
  border-radius: 3px 3px 0 0;
}

/* FORM */

.form-card {
  margin: 24px auto 0;
  max-width: 650px;
  background: rgba(251,253,254,.94);
  border: 1px solid #dce7eb;
  border-radius: 19px;
  padding: 27px 30px;
  box-shadow: 0 12px 35px rgba(64,85,100,.07);
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 1px solid #e8eef1;
  margin-bottom: 20px;
}

.card-title {
  font-size: 14px;
  font-weight: 900;
}

.card-code {
  font-family: 'DM Mono', monospace;
  color: #93a2aa;
  font-size: 9px;
}

.progress-wrap {
  height: 5px;
  background: #eaf0f2;
  border-radius: 9px;
  overflow: hidden;
  margin-bottom: 24px;
}

.progress {
  height: 100%;
  width: 25%;
  background: linear-gradient(90deg,#a9cbd9,#e8c2ce);
  border-radius: 9px;
  transition: width .3s;
}

.question-number {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: #8ba5b2;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.question {
  font-size: 19px;
  line-height: 1.4;
  font-weight: 800;
  margin-bottom: 20px;
}

.answers {
  display: grid;
  gap: 10px;
}

.answer {
  text-align: left;
  border: 1px solid #e1e9ed;
  background: #f8fbfc;
  border-radius: 11px;
  padding: 13px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: #45535d;
  cursor: pointer;
  transition: .2s;
}

.answer:hover {
  background: #edf6f9;
  border-color: #b7d1dc;
  transform: translateY(-1px);
}

.answer.selected {
  background: #eaf3f7;
  border-color: #9dbdcb;
}

.result {
  display: none;
  text-align: center;
  padding: 10px 0 2px;
}

.result h2 {
  font-size: 25px;
  margin: 8px 0;
}

.result p {
  color: #74838d;
  line-height: 1.7;
  font-size: 14px;
}

.result-stamp {
  display: inline-block;
  border: 2px solid #d6aab9;
  color: #b47f91;
  padding: 7px 14px;
  border-radius: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  transform: rotate(-3deg);
  margin-bottom: 12px;
}

.hub-button {
  display: inline-block;
  margin-top: 15px;
  padding: 13px 23px;
  border-radius: 10px;
  background: #35434e;
  color: white;
  text-decoration: none;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .8px;
  transition: .2s;
}

.hub-button:hover {
  background: #617d8c;
  transform: translateY(-2px);
}

footer {
  text-align: center;
  padding-top: 25px;
  color: #9aa7ae;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
}

@media(max-width:600px) {
  header { padding: 0 5%; height: 66px; }
  .brand { gap: 7px; }
  .brand img { width: 32px; height: 32px; }
  .brand-name { font-size: 15px; }
  .brand-section { font-size: 8px; letter-spacing: .7px; }
  .header-right { font-size: 8px; }
  main { padding-top: 34px; }
  .scene { height: 310px; }
  .cat { transform: translateX(-50%) scale(.88); transform-origin: bottom center; }
  .form-card { padding: 22px 18px; }
  .question { font-size: 17px; }
  .paper-stack { left: 3%; transform: scale(.8) rotate(-5deg); transform-origin: bottom left; }
  .pen-holder { right: 5%; transform: scale(.85); }
  .stamp { right: 19%; }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="whiskerhub.png" alt="WhiskerHub">
    <span class="brand-name">WhiskerHub</span>
    <span class="brand-divider">/</span>
    <span class="brand-section">GİRİŞ DAİRESİ</span>
  </div>
  <span class="header-right">DOSYA NO: 017</span>
</header>

<main>
  <section class="intro">
    <div class="overline">WHISKERHUB EVRENİNE AÇILAN KAPI</div>
    <h1>WhiskerHub Giriş</h1>
    <div class="subtitle">GEÇİŞ TALEBİ / FORM 017-B</div>
  </section>

  <section class="scene">
    <div class="wall-detail"></div>
    <div class="clock"></div>
    <div class="floor"></div>

    <div class="cat">
      <div class="tail"></div>
      <div class="cat-body"></div>

      <div class="cat-head">
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="eyes">
          <div class="eye"><div class="pupil"></div></div>
          <div class="eye"><div class="pupil"></div></div>
        </div>

        <div class="muzzle">
          <div class="cheek"></div>
          <div class="cheek"></div>
        </div>

        <div class="nose"></div>
        <div class="mouth"></div>
        <div class="whiskers left"></div>
        <div class="whiskers right"></div>
      </div>

      <div class="paws">
        <div class="paw"></div>
        <div class="paw"></div>
      </div>
    </div>

    <div class="desk-label">GİRİŞ MEMURLUĞU</div>

    <div class="paper-stack">
      <div class="paper"></div>
      <div class="paper"></div>
      <div class="paper">
        <div class="paper-lines"></div>
        <div class="paper-lines"></div>
        <div class="paper-lines short"></div>
        <div class="paper-stamp">ONAY</div>
      </div>
    </div>

    <div class="pen-holder">
      <div class="pen one"></div>
      <div class="pen two"></div>
    </div>

    <div class="stamp"></div>
    <div class="desk"></div>
  </section>

  <section class="form-card">
    <div class="card-top">
      <span class="card-title">Geçiş başvurusu</span>
      <span class="card-code">FORM 017-B / 04 SORU</span>
    </div>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div id="quiz">
      <div class="question-number" id="questionNumber">SORU 01 / 04</div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>
    </div>

    <div class="result" id="result">
      <div class="result-stamp">DOSYA İNCELENDİ</div>
      <h2 id="resultTitle">Başvuru tamamlandı.</h2>
      <p id="resultText"></p>
      <a class="hub-button"
         href="https://ayse-create.github.io/WhiskerHub/"
         target="_blank"
         rel="noopener">
        WHISKERHUB'A GİT
      </a>
    </div>
  </section>

  <footer>WHISKERHUB INTERNAL SYSTEMS · EST. 2026</footer>
</main>

<script>
const questions = [
  {
    question: "Bir kedi sana uzun uzun bakıyorsa ne yaparsın?",
    answers: [
      "Ben de ona bakarım. Kim önce pes edecek?",
      "Kesin bir şey istiyor, araştırılmalı.",
      "Bakışını kişisel algılamam.",
      "Hemen yetkili birime bildiririm."
    ]
  },
  {
    question: "Bir kutunun içinde başka bir kutu buldun. Ne düşünürsün?",
    answers: [
      "Kutuların da kutusu mu olur?",
      "İçinde kedi olabilir.",
      "Bu işte bir tuhaflık var.",
      "Kutuyu koruma altına alırım."
    ]
  },
  {
    question: "WhiskerHub'a giriş için en önemli şey nedir?",
    answers: [
      "Merak duygusu.",
      "Kedilere saygı.",
      "Kuralları sorgulamak.",
      "Bilinmeyene hazır olmak."
    ]
  },
  {
    question: "Son soru: Bir kedi müdür olsaydı ilk kararı ne olurdu?",
    answers: [
      "Mesai saatleri kaldırılırdı.",
      "Her masaya bir kutu konurdu.",
      "Toplantılar uyku saatine alınırdı.",
      "Bütün kararlar mama karşılığında verilirdi."
    ]
  }
];

let currentQuestion = 0;
let selectedAnswers = [];

const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const numberEl = document.getElementById("questionNumber");
const progressEl = document.getElementById("progress");

function renderQuestion() {
  const item = questions[currentQuestion];

  numberEl.textContent =
    `SORU ${String(currentQuestion + 1).padStart(2, "0")} / 04`;

  questionEl.textContent = item.question;
  answersEl.innerHTML = "";

  progressEl.style.width = `${((currentQuestion + 1) / 4) * 100}%`;

  item.answers.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;

    button.addEventListener("click", () => {
      if (button.classList.contains("selected")) return;

      selectedAnswers.push(index);
      button.classList.add("selected");

      setTimeout(() => {
        currentQuestion++;

        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showResult();
        }
      }, 250);
    });

    answersEl.appendChild(button);
  });
}

function showResult() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("result").style.display = "block";

  const titles = [
    "Şüpheli derecede meraklı.",
    "Geçişe uygun bulundu.",
    "Kedi konseyi seni bekliyor.",
    "Dosya beklenenden ilginç."
  ];

  const descriptions = [
    "Cevapların incelendi. Biraz fazla soru soruyorsun ama bu kurumda bu özellik pek sorun değil.",
    "Başvurun olumlu değerlendirildi. Giriş kapısı senin için açılabilir.",
    "Kedi konseyi değerlendirmesini tamamladı. Sonuç: oldukça ilginç bir aday.",
    "Memur kedimiz dosyanı inceledi. Bir süre düşündü. Sonra onayladı."
  ];

  const resultIndex =
    selectedAnswers.reduce((a, b) => a + b, 0) % 4;

  document.getElementById("resultTitle").textContent =
    titles[resultIndex];

  document.getElementById("resultText").textContent =
    descriptions[resultIndex];
}

renderQuestion();

/* Gözler aynı yöne ve sınırlı miktarda hareket eder. */
const pupils = document.querySelectorAll(".pupil");
const catHead = document.querySelector(".cat-head");

document.addEventListener("mousemove", (event) => {
  const rect = catHead.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const dx = event.clientX - centerX;
  const dy = event.clientY - centerY;

  const distance = Math.sqrt(dx * dx + dy * dy) || 1;
  const movement = Math.min(3, distance / 100);

  const moveX = (dx / distance) * movement;
  const moveY = (dy / distance) * movement;

  pupils.forEach((pupil) => {
    pupil.style.transform =
      `translate(${moveX}px, ${moveY}px)`;
  });
});
</script>
